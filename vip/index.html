<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPZ+ | Live</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('tpz-theme') || 'dark');</script>
<style>
:root, [data-theme="dark"] {
  --bg: #000; --bg-gradient: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
  --text: #fff; --text2: rgba(255,255,255,.7); --text3: rgba(255,255,255,.4);
  --accent: #10B981; --accent-light: #34D399; --accent-glow: rgba(16,185,129,0.25);
  --glass: rgba(255,255,255,0.03); --glass-hover: rgba(255,255,255,0.08);
  --hair: rgba(255,255,255,0.08); --hair-light: rgba(255,255,255,0.2);
  --nav-bg: rgba(10,10,10,0.5);
  --glass-shadow: 0 20px 40px -10px rgba(0,0,0,0.8);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,0.15);
  --btn-bg: #fff; --btn-text: #000;
}
[data-theme="light"] {
  --bg: #EEF0F3; --bg-gradient: linear-gradient(180deg, #F7F8FA 0%, #E8EAEE 100%);
  --text: #1A1D21; --text2: #5A6069; --text3: #8A9099;
  --accent: #059669; --accent-light: #10B981; --accent-glow: rgba(5,150,105,0.18);
  --glass: rgba(255,255,255,0.65); --glass-hover: rgba(255,255,255,0.85);
  --hair: rgba(255,255,255,0.9); --hair-light: rgba(200,205,215,0.6);
  --nav-bg: rgba(255,255,255,0.7);
  --glass-shadow: 0 15px 35px -12px rgba(30,40,60,0.15), 0 2px 6px rgba(30,40,60,0.06);
  --glass-inner: inset 0 1px 0 rgba(255,255,255,1);
  --btn-bg: #1A1D21; --btn-text: #fff;
}
:root { --radius: 24px; --radius-sm: 12px; --ease: cubic-bezier(0.25,1,0.5,1); }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-gradient);background-attachment:fixed;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;transition:background 0.4s ease, color 0.4s ease}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 10% 10%, var(--accent-glow), transparent 40%), radial-gradient(circle at 90% 90%, var(--glass-hover), transparent 50%);filter:blur(80px);opacity:0.7;transition:background 0.4s ease}
body>*{position:relative;z-index:1}
a{color:inherit;text-decoration:none}

.nav-wrap{position:sticky;top:0;z-index:100;padding:16px 24px}
.nav{height:64px;padding:0 24px;max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;background:var(--nav-bg);backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--hair);border-radius:999px;box-shadow:var(--glass-shadow), var(--glass-inner);transition:background 0.4s ease}
.brand{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg, var(--text) 20%, var(--accent-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .plus{color:var(--accent);-webkit-text-fill-color:var(--accent);font-size:26px}
.back{font-size:14px;font-weight:600;color:var(--text2);padding:8px 20px;border:1px solid var(--hair);border-radius:999px;transition:all .2s}
.back:hover{color:var(--text);background:var(--glass)}

main{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:24px 24px 80px}
.title{font-size:32px;font-weight:900;letter-spacing:-1.5px;line-height:1.1;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;font-weight:700;margin-bottom:24px}
.chip{background:var(--glass);border:1px solid var(--hair);padding:6px 14px;border-radius:999px;color:var(--text2)}
.chip.live{color:var(--accent-light);border-color:rgba(16,185,129,0.3);display:flex;align-items:center;gap:6px;background:rgba(16,185,129,0.1)}
.chip.live .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-light);box-shadow:0 0 10px var(--accent-light);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.player{background:#000;border:1px solid var(--hair-light);border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;width:100%;position:relative;box-shadow:var(--glass-shadow)}

.player-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #000; cursor: pointer; transition: all 0.3s ease; }
.player-placeholder:hover { background: #111; }
[data-theme="light"] .player-placeholder { background: #d4d6da; }
[data-theme="light"] .player-placeholder:hover { background: #c4c7cc; }
.player-placeholder-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 2px solid rgba(255,255,255,0.3); display: grid; place-items: center; font-size: 32px; color: #fff; transition: all 0.3s ease; }
[data-theme="light"] .player-placeholder-icon { background: rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.2); color: #1A1D21; }
.player-placeholder:hover .player-placeholder-icon { background: var(--accent); color: #000; transform: scale(1.1); border-color: var(--accent); }
.player-placeholder-text { color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 600; }
[data-theme="light"] .player-placeholder-text { color: #5A6069; }

.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.shield{position:absolute;left:0;right:0;z-index:5}
.shield.top{top:0;height:12%}
.shield.bot{bottom:0;height:4%}

.note { margin-top: 24px; padding: 20px; background: var(--glass); border: 1px solid var(--hair); border-radius: var(--radius); font-size: 13px; color: var(--text2); line-height: 1.6; font-weight: 500; }
.note a { color: var(--accent-light); font-weight: 700; }

.error{text-align:center;padding:100px 20px}
.error h2{font-size:24px;font-weight:900;margin-bottom:12px}
.error p{color:var(--text2);margin-bottom:24px}
.error a{background:var(--btn-bg);color:var(--btn-text);padding:12px 28px;border-radius:999px;font-weight:700;display:inline-block}

@media(max-width:700px){
  .nav-wrap{padding:10px} .nav{padding:0 12px;height:56px;gap:8px} .brand{font-size:18px}
  main{padding:12px}
  .title{font-size:24px}
  .shield.top{height:28%}
  .shield.bot{height:12%}
}
</style>
</head>
<body>

<div class="nav-wrap">
  <nav class="nav">
    <a href="../index.html" class="brand">TPZ<span class="plus">+</span></a>
    <a href="../index.html" class="back">← Retour</a>
  </nav>
</div>

<main id="app">
  <div class="error"><h2>Chargement...</h2></div>
</main>

<script src="../links.js"></script>
<script src="../streams.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
function parisTime(s){
  if(!s) return 0;
  if(!s.includes('Z')&&!s.includes('+')) return new Date(s+'+02:00').getTime();
  return new Date(s).getTime();
}
function isHls(u){return /\.(m3u8|mpd)(\?|$)/i.test(u)}

const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');
const match = (window.TPZ_STREAMS||[]).find(m=>m.id===id);

if(!match){
  app.innerHTML = `<div class="error"><h2>Match introuvable</h2><p>Le contenu demandé n'existe pas.</p><a href="../index.html">Retour à l'accueil</a></div>`;
} else {
  const t = parisTime(match.heureDebut);
  const live = match.forceLive || !match.heureDebut || t <= Date.now();

  if(!live){
    app.innerHTML = `<div class="error"><h2>⏰ Pas encore en direct</h2><p>Le match n'a pas encore commencé.</p><a href="../index.html">Retour</a></div>`;
  } else {
    const url = match.url || (match.langues && match.langues[0] && match.langues[0].url);
    const sportLabel = (match.sport||'').replace(/^[\p{Emoji}\s]+/u,'') || 'Direct';

    app.innerHTML = `
      <div class="header">
        <h1 class="title">${match.nom}</h1>
        <div class="meta">
          <span class="chip live"><span class="dot"></span> En direct</span>
          <span class="chip">${sportLabel}</span>
          ${match.competition?`<span class="chip">${match.competition}</span>`:''}
        </div>
      </div>
      
      <div class="player" id="player">
        <div class="player-placeholder" id="playerPlaceholder">
          <div class="player-placeholder-icon">▶</div>
          <div class="player-placeholder-text">Cliquer pour lancer le flux</div>
        </div>
      </div>

      <div class="note">
        💡 <strong>Astuce :</strong> si le flux ne se lance pas, rechargez la page. <br>
        Source externe : <a href="https://cdnlivetv.is/" target="_blank">CDN Live TV</a>. TPZ+ n'héberge aucun contenu.
      </div>
    `;

    const placeholder = document.getElementById('playerPlaceholder');
    const player = document.getElementById('player');
    let loaded = false;

    placeholder.addEventListener('click', () => {
      if(loaded) return;
      loaded = true;
      placeholder.remove();

      if(isHls(url)){
        player.innerHTML = '<video id="vid" controls autoplay playsinline style="width:100%;height:100%;background:#000"></video>';
        const vid = document.getElementById('vid');
        if(window.Hls && Hls.isSupported()){
          const hls = new Hls(); hls.loadSource(url); hls.attachMedia(vid);
        } else if(vid.canPlayType('application/vnd.apple.mpegurl')){
          vid.src = url;
        } else {
          player.innerHTML = '<div class="error"><h2>Format non supporté</h2></div>';
        }
      } else {
        player.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe><div class="shield top"></div><div class="shield bot"></div>`;
      }
    });
  }
}
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
